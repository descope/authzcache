version: "2"
linters:
  default: none
  enable:
    - depguard
    - forbidigo
    - godox
    - gosec
    - govet
    - revive
  settings:
    depguard:
      rules:
        packages-with-error-message:
          files:
            - '!**/masker/masker.go'
          deny:
            - pkg: github.com/ggwhite/go-masker
              desc: masking is allowed only by github.com/descope/backend/common/pkg/common/masker
            - pkg: github.com/sirupsen/logrus
              desc: logging is allowed only with zerolog
            - pkg: log
              desc: logging is allowed only with zerolog
            - pkg: github.com/golang/protobuf
              desc: github.com/golang/protobuf is deprecated you should use google.golang.org/protobuf instead
    forbidigo:
      forbid:
        - pattern: fmt\.Print.*(# Do not commit print statements\.)?
        - pattern: fmt\.Error.*(# Do not commit fmt error statements\.)?
        - pattern: errors\.New$(# Do not create new errors from the standard go errors package\.)?
        - pattern: json\.Marshal.*(# Use utils\.Marshal\.)?
        - pattern: json\.Unmarshal.*(# Use utils\.Unmarshal\.)?
        - pattern: \.Msgf.*(# Do not use message formatting\.)?
      exclude-godoc-examples: true
    gosec:
      excludes:
        - G104
    govet:
      enable:
        - atomicalign
      disable:
        - shadow
        - composites
        - testinggoroutine
      enable-all: false
      disable-all: false
      settings:
        printf:
          funcs:
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Infof
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Warnf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Errorf
            - (github.com/golangci/golangci-lint/pkg/logutils.Log).Fatalf
    revive:
      confidence: 0.8
      rules:
        - name: defer
          arguments:
            - - loop
              - return
        - name: blank-imports
        - name: context-as-argument
        - name: dot-imports
        - name: error-return
        - name: error-strings
        - name: error-naming
        - name: increment-decrement
        - name: var-naming
        - name: range
        - name: receiver-naming
        - name: indent-error-flow
        - name: superfluous-else
        - name: unreachable-code
        - name: unused-parameter
        - name: unconditional-recursion
        - name: waitgroup-by-value
        - name: duplicated-imports
        - name: unreachable-code
        - name: context-keys-type
        - name: time-naming
        - name: var-declaration
        - name: errorf
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
formatters:
  enable:
    - gofmt
    - goimports
  settings:
    gofmt:
      simplify: false
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
